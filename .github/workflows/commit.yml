name: "Commit"

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_call:

permissions:
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go build -o policyguard ./cmd/policyguard/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Run Go tests
        run: gotestsum --junitfile junit-report.xml --format standard-verbose ./...
      - id: junit-reports-exist
        uses: andstor/file-existence-action@v3
        with:
          files: "junit-report.xml"
      - if: steps.junit-reports-exist.outputs.files_exists == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'junit-report.xml'

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go vet ./...

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - run: gocyclo -over 12 -ignore '_test\.go$' .

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: golangci-lint run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -exclude=G104,G304 -fmt=junit-xml -out=gosec-report.xml -stdout ./...
      - id: gosec-report-exists
        uses: andstor/file-existence-action@v3
        with:
          files: "gosec-report.xml"
      - if: steps.gosec-report-exists.outputs.files_exists == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'gosec-report.xml'

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: 'go'
      - uses: github/codeql-action/analyze@v4
