# PII redaction before LLM
#
# Any codepath that loads a user record (or other PII source) and reaches
# an LLM API must pass through a redactor first. All three predicate
# kinds are honored: `calls`, `has_decorator`, and `field_access`. The
# field-access pattern `*.<name>` matches any attribute read of that
# name regardless of the receiver.
id: pii-redaction-before-llm
severity: error
languages: [python]
source:
  any_of:
    - calls: app.handlers.load_user
    - calls: user_repo.get_user
    - calls: session.current_user
    - field_access: "*.email"
sink:
  any_of:
    - calls: anthropic.messages.create
    - calls: openai.chat.completions.create
guard:
  any_of:
    - calls: redactor.redact
    - calls: app.redactor.redact
    - has_decorator: "@redacted"
message: User PII reaches LLM call without passing through redactor.
fix:
  level: idiomatic
  suggestion: "Wrap the user value in {guard}() before passing it to {sink.callee} at {sink.path}:{sink.line}."
  # Sink is called positionally; wrap argument 0 with the guard call.
  # When the sink uses keyword args (e.g. anthropic.messages.create's
  # `input=user`), this won't apply — keyword-arg wrapping is a follow-up.
  wrap_argument: 0
